
name: Build RifjerWrt AW1000

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rifjerwrt-aw1000-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile OpenWrt PPE-NSS for Arcadyan AW1000
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    env:
      UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
      UPSTREAM_REF: ppe-nss
      BUILDER_REPO: JuliusBairaktaris/Qualcommax_NSS_Builder
      BUILDER_REF: main
      DEVICE: ipq807x-1g
      VARIANT: ppe-nss
      FEEDS: |
        src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss
        src-git luci https://github.com/JuliusBairaktaris/luci.git;luci-app-ppe-qos
        src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main

    steps:
      - name: Checkout RifjerWrt custom files
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: rifjerwrt
          
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync unzip

      - name: Checkout OpenWrt PPE-NSS source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout upstream NSS builder
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BUILDER_REPO }}
          ref: ${{ env.BUILDER_REF }}
          fetch-depth: 1
          path: builder

      - name: Add local STRXWALL package
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/rifjerwrt/RifjerWrt-packages-strxwall-layout.zip"
          test -f "$ZIP"
          mkdir -p "$RUNNER_TEMP/strxwall-package"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/strxwall-package"

          SRC="$RUNNER_TEMP/strxwall-package/packages/strxwall/luci-app-strxwall"
          test -f "$SRC/Makefile"

          mkdir -p openwrt/package/strxwall/luci-app-strxwall
          cp -a "$SRC"/. openwrt/package/strxwall/luci-app-strxwall/
          
      - name: Prepare AW1000 configuration
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: |
          set -euo pipefail
          bash builder/scripts/prepare-build.sh
      
      - name: Enable STRXWALL package
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo 'CONFIG_PACKAGE_luci-app-strxwall=y' >> .config
          echo 'CONFIG_PACKAGE_dns2socks=y' >> .config
          echo 'CONFIG_PACKAGE_conntrack=y' >> .config

          make defconfig

          for package in luci-app-strxwall dns2socks conntrack; do
            if ! grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Required package ${package} was dropped by Kconfig"
              exit 1
            fi
          done

          echo "=== Package manager configuration ==="
          grep -E '^(CONFIG_USE_APK|CONFIG_PACKAGE_MANAGER)' .config || true

          echo "STRXWALL dependencies verified."
      
      - name: Verify STRXWALL package payload
        working-directory: openwrt
        run: |
          set -euo pipefail

          PKG="package/strxwall/luci-app-strxwall"
          CONFIG="$PKG/files/etc/config/strxwall"
          INIT="$PKG/files/etc/init.d/strxwall"
          DNS="$PKG/files/usr/libexec/strxwall-dns"

          test -f "$PKG/Makefile"
          test -f "$CONFIG"
          test -f "$INIT"
          test -f "$DNS"

          grep -q 'PKG_VERSION:=2.5.53' "$PKG/Makefile"

          grep -Eq "option enabled ['\"]0['\"]" "$CONFIG" || {
            echo "::error::STRXWALL must be OFF by default"
            exit 1
          }

          grep -q "CONFIG_PACKAGE_luci-app-strxwall=y" .config
          grep -q "CONFIG_PACKAGE_dns2socks=y" .config
          grep -q "CONFIG_PACKAGE_conntrack=y" .config

          echo "STRXWALL package payload verified."
          echo "STRXWALL default state: OFF"
          echo "Package version: 2.5.53"

          echo "=== Package manager ==="
          grep -E '^(CONFIG_USE_APK|CONFIG_PACKAGE_MANAGER)' .config || true
    
      - name: Download source packages
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Source download failed"
              exit 1
            fi
            sleep 5
          done

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" IGNORE_ERRORS=m || make -j1 V=s IGNORE_ERRORS=m

      - name: Collect AW1000 sysupgrade image
        id: image
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t images < <(find openwrt/bin/targets -type f \
            -name '*arcadyan_aw1000*squashfs-sysupgrade.bin')

          if [[ ${#images[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one AW1000 image"
            find openwrt/bin/targets -type f -name '*.bin' -print
            exit 1
          fi

          cp "${images[0]}" release/
          cp "$(dirname "${images[0]}")/config.buildinfo" release/ 2>/dev/null || true
          (cd release && sha256sum *.bin > SHA256SUMS)
          echo "image=$(basename "${images[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RifjerWrt-AW1000-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Send firmware to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          IMAGE=$(find release -maxdepth 1 -type f -name '*.bin' -print -quit)

          if [[ -z "$IMAGE" ]]; then
            echo "::error::Firmware image not found"
            exit 1
          fi

          IMAGE_SIZE=$(stat -c%s "$IMAGE")

          if [[ "$IMAGE_SIZE" -le 49000000 ]]; then
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${IMAGE}" \
              -F "caption=RifJerWrt AW1000 BUILD SUCCESS ✅ Build #${GITHUB_RUN_NUMBER}"
          else
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=Firmware berjaya dikompil tetapi terlalu besar untuk dihantar terus. Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          if [[ -f release/SHA256SUMS ]]; then
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@release/SHA256SUMS"
          fi

      - name: Build summary
        run: |
          {
            echo "## RifjerWrt AW1000 build"
            echo "- Device: Arcadyan AW1000"
            echo "- Target: qualcommax/ipq807x"
            echo "- Source: $UPSTREAM_REPO@$UPSTREAM_REF"
            echo "- Builder: $BUILDER_REPO@$BUILDER_REF"
            echo "- Firmware: ${{ steps.image.outputs.image }}"
            echo
            echo "Sysupgrade image only. Do not flash directly over stock vendor firmware."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Notify Telegram on build failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ RIFJERWRT BUILD FAILED
          Repository: ${GITHUB_REPOSITORY}
          Build: #${GITHUB_RUN_NUMBER}
          Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
