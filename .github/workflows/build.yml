name: Build RifjerWrt AW1000

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rifjerwrt-aw1000-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile OpenWrt PPE-NSS for Arcadyan AW1000
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    env:
      UPSTREAM_REPO: JuliusBairaktaris/openwrt-ppe-nss
      UPSTREAM_REF: ppe-nss
      BUILDER_REPO: JuliusBairaktaris/Qualcommax_NSS_Builder
      BUILDER_REF: main
      DEVICE: ipq807x-1g
      VARIANT: ppe-nss
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      FEEDS: |
        src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss
        src-git luci https://github.com/JuliusBairaktaris/luci.git;luci-app-ppe-qos
        src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
        src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main

    steps:
      - name: Checkout RifjerWrt custom files
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: rifjerwrt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bzip2 clang ccache file flex gawk gettext git \
            libncurses-dev libssl-dev make patch perl python3 rsync \
            subversion unzip wget which ca-certificates curl zlib1g-dev
          ccache --version
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          
      - name: Download and verify friend-fixed AW1000 UBI
        run: |
          set -euo pipefail
          mkdir -p reference

          UBI="reference/hornetwrt-factory-fix.ubi"
          URL="https://github.com/Zairifki/RifJerWRT-AW1000/releases/download/aw1000-fixed-ubi/hornetwrt-factory-fix.ubi"

          curl -fL --retry 3 "$URL" -o "$UBI"

          echo "f8b8c061edee6177458747a95ab6201a77d4e68f8fcb83fb0444eb3f221f91bd  $UBI" | sha256sum -c -

          test "$(stat -c%s "$UBI")" -eq 46137344

          echo "Fixed AW1000 UBI downloaded and verified."
          ls -lh "$UBI"

      - name: Checkout OpenWrt PPE-NSS source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout upstream NSS builder
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BUILDER_REPO }}
          ref: ${{ env.BUILDER_REF }}
          fetch-depth: 1
          path: builder

      - name: Add local STRXWALL package
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/rifjerwrt/RifjerWrt-packages-strxwall-layout.zip"
          test -f "$ZIP"
          mkdir -p "$RUNNER_TEMP/strxwall-package"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/strxwall-package"
          SRC="$RUNNER_TEMP/strxwall-package/packages/strxwall/luci-app-strxwall"
          test -f "$SRC/Makefile"
          mkdir -p openwrt/package/strxwall/luci-app-strxwall
          cp -a "$SRC"/. openwrt/package/strxwall/luci-app-strxwall/

      - name: Prepare AW1000 configuration
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: |
          set -euo pipefail
          bash builder/scripts/prepare-build.sh

      - name: Fix PF_RING Linux 6.18 compatibility
        run: |
          set -euo pipefail

          PATCH_DIR="openwrt/feeds/packages/libs/libpfring/patches"
          mkdir -p "$PATCH_DIR"

          cat > "$PATCH_DIR/003-linux-6.18-sockaddr.patch" <<'EOF'
          --- a/kernel/pf_ring.c
          +++ b/kernel/pf_ring.c
          @@ -5851 +5851 @@
          -static int ring_bind(struct socket *sock, struct sockaddr_unsized *sa, int addr_len)
          +static int ring_bind(struct socket *sock, struct sockaddr *sa, int addr_len)
          EOF

          echo "PF_RING compatibility patch prepared."

      - name: Fix PF_RING compatibility with Linux 6.18.64
        run: |
          set -euo pipefail
          PATCH_DIR="openwrt/feeds/packages/libs/libpfring/patches"
          mkdir -p "$PATCH_DIR"

          cat > "$PATCH_DIR/003-fix-compilation-on-6.18.64.patch" <<'EOF'
          --- a/kernel/pf_ring.c
          +++ b/kernel/pf_ring.c
          @@ -5851 +5851 @@
          -static int ring_bind(struct socket *sock, struct sockaddr_unsized *sa, int addr_len)
          +static int ring_bind(struct socket *sock, struct sockaddr *sa, int addr_len)
          EOF

          echo "PF_RING compatibility patch added."

      - name: Add PassWall 2 package
        working-directory: openwrt
        run: |
          set -euo pipefail
          test -f feeds/passwall2/luci-app-passwall2/Makefile
          ./scripts/feeds install -p passwall2 luci-app-passwall2
          test -f package/feeds/passwall2/luci-app-passwall2/Makefile
          echo "PassWall 2 source installed."

      - name: Add Footstrap LuCI theme
        working-directory: openwrt
        run: |
          set -euo pipefail
          if [ ! -f feeds/luci/themes/luci-theme-footstrap/Makefile ]; then
            echo "::error::Footstrap is missing from the LuCI feed"
            exit 1
          fi
          ./scripts/feeds install luci-theme-footstrap
          test -f package/feeds/luci/luci-theme-footstrap/Makefile
          echo "Footstrap theme source verified."

      - name: Add 7Dollar LuCI theme
        working-directory: openwrt
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.0.19 \
            https://github.com/itsmaiGe/luci-theme-7dollar.git \
            package/luci-theme-7dollar
          test -f package/luci-theme-7dollar/Makefile
          echo "7Dollar theme v1.0.19 source added."

      - name: Add TTL64 rules
        run: |
          set -euo pipefail
          DIR="openwrt/files/usr/share/nftables.d/chain-post/mangle_postrouting"
          mkdir -p "$DIR"
          cat > "$DIR/99-ttl64.nft" <<'EOF'
          oifname $wan_devices counter ip ttl set 64
          oifname $wan_devices counter ip6 hoplimit set 64
          EOF
          test -s "$DIR/99-ttl64.nft"
          echo "TTL64 IPv4 and IPv6 rules added."

      - name: Set Footstrap as default LuCI theme
        run: |
          set -euo pipefail
          DIR="openwrt/files/etc/uci-defaults"
          mkdir -p "$DIR"
          cat > "$DIR/99-rifjerwrt-default-theme" <<'EOF'
          #!/bin/sh
          uci -q set luci.main.mediaurlbase='/luci-static/footstrap'
          uci -q commit luci
          exit 0
          EOF
          chmod 0755 "$DIR/99-rifjerwrt-default-theme"
          test -s "$DIR/99-rifjerwrt-default-theme"
          echo "Footstrap configured as default LuCI theme."

      - name: Configure HornetWrt WiFi
        run: |
          set -euo pipefail
          DIR="openwrt/files/etc/uci-defaults"
          mkdir -p "$DIR"

          cat > "$DIR/99zz-hornetwrt-wireless" <<'EOF'
          #!/bin/sh

          for dev in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do
              band="$(uci -q get wireless.$dev.band || true)"
              hwmode="$(uci -q get wireless.$dev.hwmode || true)"

              case "$band:$hwmode" in
                  2g:*|*:11g|*:11b|*:11ng)
                      ssid="HornetWrt_2G"
                      ;;
                  5g:*|*:11a|*:11ac|*:11ax)
                      ssid="HornetWrt_5G"
                      ;;
                  *)
                      continue
                      ;;
              esac

              iface=""
              for section in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-iface$/\1/p'); do
                  [ "$(uci -q get wireless.$section.device)" = "$dev" ] || continue
                  [ "$(uci -q get wireless.$section.mode)" = "ap" ] || continue
                  case "$section" in
                      default_radio*)
                          iface="$section"
                          break
                          ;;
                  esac
              done

              if [ -z "$iface" ]; then
                  iface="hornet_${dev}"
                  uci set wireless.$iface=wifi-iface
                  uci set wireless.$iface.device="$dev"
                  uci set wireless.$iface.network="lan"
                  uci set wireless.$iface.mode="ap"
              fi

              uci set wireless.$iface.ssid="$ssid"
              uci set wireless.$iface.encryption="psk2"
              uci set wireless.$iface.key="password"
              uci set wireless.$iface.disabled="0"
          done

          uci commit wireless
          exit 0
          EOF

          chmod 0755 "$DIR/99zz-hornetwrt-wireless"
          echo "HornetWrt WiFi defaults prepared."

      - name: Enable RifjerWrt packages and ccache
        working-directory: openwrt
        run: |
          set -euo pipefail
          echo 'CONFIG_CCACHE=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-strxwall=y' >> .config
          echo 'CONFIG_PACKAGE_dns2socks=y' >> .config
          echo 'CONFIG_PACKAGE_conntrack=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-7dollar=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-footstrap=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall2=y' >> .config
          make defconfig

          grep -qx 'CONFIG_CCACHE=y' .config || {
            echo "::error::ccache was dropped by Kconfig"
            exit 1
          }

          for package in luci-app-strxwall dns2socks conntrack luci-theme-7dollar luci-theme-footstrap luci-app-passwall2; do
            if ! grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Required package ${package} was dropped by Kconfig"
              exit 1
            fi
          done
          echo "=== Package manager configuration ==="
          grep -E '^(CONFIG_USE_APK|CONFIG_PACKAGE_MANAGER)' .config || true
          echo "RifjerWrt packages and ccache configuration verified."

      - name: Verify STRXWALL package payload
        working-directory: openwrt
        run: |
          set -euo pipefail
          PKG="package/strxwall/luci-app-strxwall"
          CONFIG="$PKG/files/etc/config/strxwall"
          INIT="$PKG/files/etc/init.d/strxwall"
          DNS="$PKG/files/usr/libexec/strxwall-dns"
          test -f "$PKG/Makefile"
          test -f "$CONFIG"
          test -f "$INIT"
          test -f "$DNS"
          test -f package/luci-theme-7dollar/Makefile
          grep -qx "CONFIG_PACKAGE_luci-theme-7dollar=y" .config
          echo "7Dollar theme v1.0.19 verified."
          test -f package/feeds/luci/luci-theme-footstrap/Makefile
          grep -qx "CONFIG_PACKAGE_luci-theme-footstrap=y" .config
          echo "Footstrap theme verified."
          test -f package/feeds/passwall2/luci-app-passwall2/Makefile
          grep -qx "CONFIG_PACKAGE_luci-app-passwall2=y" .config
          echo "PassWall 2 package verified."
          grep -q 'PKG_VERSION:=2.5.53' "$PKG/Makefile"
          grep -Eq "option enabled ['\"]0['\"]" "$CONFIG" || {
            echo "::error::STRXWALL must be OFF by default"
            exit 1
          }
          grep -q "CONFIG_PACKAGE_luci-app-strxwall=y" .config
          grep -q "CONFIG_PACKAGE_dns2socks=y" .config
          grep -q "CONFIG_PACKAGE_conntrack=y" .config
          echo "STRXWALL package payload verified."
          echo "STRXWALL default state: OFF"
          echo "Package version: 2.5.53"
          echo "=== Package manager ==="
          grep -E '^(CONFIG_USE_APK|CONFIG_PACKAGE_MANAGER)' .config || true

      - name: Restore OpenWrt download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            .ccache
          key: rifjerwrt-aw1000-${{ runner.os }}-${{ env.UPSTREAM_REF }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            rifjerwrt-aw1000-${{ runner.os }}-${{ env.UPSTREAM_REF }}-
            rifjerwrt-aw1000-${{ runner.os }}-

      - name: Show cache status
        run: |
          set -euo pipefail
          ccache --show-stats || true
          du -sh openwrt/dl .ccache 2>/dev/null || true

      - name: Download source packages
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Source download failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "===== BUILD START ====="
          date -u

          make -j"$(nproc)" V=s 2>&1 | tee ../build.log

          echo "===== BUILD FINISHED ====="
          date -u

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RifjerWrt-Build-Log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show compiler cache statistics
        if: always()
        run: |
          ccache --show-stats || true
      
      - name: Collect HornetWrt AW1000 firmware
        id: image
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -t images < <(find openwrt/bin/targets -type f \
            -name '*arcadyan_aw1000*squashfs-sysupgrade.bin')

          if [[ ${#images[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one AW1000 image"
            exit 1
          fi

          cp "${images[0]}" \
            release/HornetWrt-AW1000-sysupgrade.bin

          cp "$(dirname "${images[0]}")/config.buildinfo" \
            release/ 2>/dev/null || true

          (cd release && sha256sum *.bin > SHA256SUMS)

          echo "image=HornetWrt-AW1000-sysupgrade.bin" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RifjerWrt-AW1000-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## RifjerWrt AW1000 build"
            echo "- Device: Arcadyan AW1000 Hardware V1"
            echo "- Target: qualcommax/ipq807x"
            echo "- Source: $UPSTREAM_REPO@$UPSTREAM_REF"
            echo "- Builder: $BUILDER_REPO@$BUILDER_REF"
            echo "- Firmware: ${{ steps.image.outputs.image }}"
            echo
            echo "Sysupgrade image only. Do not flash directly over stock vendor firmware."
          } >> "$GITHUB_STEP_SUMMARY"
